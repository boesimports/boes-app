    window.__BOES_STANDALONE__ = true;
    window.storage = {
      get: async function (key, shared) {
        try { var raw = localStorage.getItem(key); return raw != null ? { key: key, value: raw, shared: !!shared } : null; } catch (e) { return null; }
      },
      set: async function (key, value, shared) {
        try { localStorage.setItem(key, value); return { key: key, value: value, shared: !!shared }; } catch (e) { throw e; }
      },
      delete: async function (key, shared) {
        try { localStorage.removeItem(key); return { key: key, deleted: true, shared: !!shared }; } catch (e) { return null; }
      },
      list: async function (prefix, shared) {
        try { var keys = Object.keys(localStorage).filter(function (k) { return !prefix || k.indexOf(prefix) === 0; }); return { keys: keys, prefix: prefix, shared: !!shared }; } catch (e) { return { keys: [] }; }
      },
